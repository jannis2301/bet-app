name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Frontend typecheck
        run: pnpm --dir client run typecheck

      - name: Backend tests
        run: pnpm run test

      - name: Frontend tests
        run: pnpm --dir client run test

      - name: Build frontend
        run: pnpm run build-client
