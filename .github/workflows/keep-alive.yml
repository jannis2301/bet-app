name: Keep-alive ping

# Render's free plan suspends the service after ~15 minutes without HTTP
# traffic, which also stops the in-process cron timers (see
# scheduler/matchCompareScheduler.ts and scheduler/reminderScheduler.ts).
# Pinging the healthcheck endpoint regularly keeps it awake so those jobs —
# and the startup catch-up run in server.ts — actually get a chance to run.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping healthcheck endpoint
        run: curl --fail --silent --show-error https://bet-app-4w2c.onrender.com/healthcheck
