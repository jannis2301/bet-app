# Monolith deploy: this single Node service builds the client (see
# "setup-production" in package.json) and serves it statically via
# server.js's production static-file + SPA catch-all block — no
# separate frontend service is needed.
#
# MongoDB is not a Render-managed database type (Render's `databases:`
# key only supports Postgres/Key Value), so MONGODB_URI must point to
# an externally hosted instance (e.g. MongoDB Atlas) and is entered
# manually in the Render dashboard on first deploy (sync: false).
#
# RESEND_API_KEY/EMAIL_FROM configure outbound mail (see utils/sendEmail.ts),
# used for the matchday reminder emails (scheduler/matchdayReminder.ts) and
# the forgot-password reset link (controllers/authController.ts) — sent via
# Resend's HTTPS API rather than SMTP, since Render's free tier blocks
# outbound SMTP ports entirely. Enter the API key manually in the Render
# dashboard (sync: false).
services:
  - type: web
    name: bet-app
    runtime: node
    plan: free
    buildCommand: pnpm run setup-production
    startCommand: node dist/server.js
    healthCheckPath: /healthcheck
    envVars:
      - key: NODE_VERSION
        value: 24.20.0
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_LIFETIME
        value: 1d
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
